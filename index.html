<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Las sombras de los reinos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      background:
        radial-gradient(circle at center, #26352b 0%, #111713 45%, #050706 100%);

      color: #f3ead8;
      font-family: Georgia, serif;
    }

    .inicio {
      padding: 40px;
    }

    .saga {
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 25px;
      opacity: 0.7;
    }

    h1 {
      font-size: clamp(42px, 8vw, 95px);
      font-weight: normal;
      line-height: 0.95;
      margin-bottom: 25px;
    }

    .subtitulo {
      font-size: 18px;
      font-style: italic;
      opacity: 0.75;
      margin-bottom: 40px;
    }

    button {
      padding: 15px 30px;
      background: transparent;
      border: 1px solid #d7c7a5;
      color: #f3ead8;
      font-family: Georgia, serif;
      letter-spacing: 3px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #f3ead8;
      color: #111713;
    }
  </style>
</head>

<body>

  <main class="inicio">

    <p class="saga">Las sombras de los reinos</p>

    <h1>
      El precio<br>
      de la abundancia
    </h1>

    <p class="subtitulo">
      Siete reinos. Un mundo por descubrir.
    </p>

    <button>ENTRAR EN SGARDCROD</button>

  </main>

</body>
</html>
