
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eryndor · Las sombras de los reinos</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #panorama {
      width: 100%;
      height: 100vh;
    }

    /* TÍTULO */

    .titulo {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      text-align: center;
      color: white;

      font-family: Georgia, serif;

      text-shadow:
        0 2px 8px black,
        0 0 20px rgba(0,0,0,.8);

      pointer-events: none;
    }

    .titulo h1 {
      font-size: 34px;
      letter-spacing: 7px;
      font-weight: normal;
    }

    .titulo p {
      margin-top: 6px;
      font-size: 16px;
      font-style: italic;
    }


    /* BOTÓN VOLVER */

    .volver {
      position: absolute;
      top: 24px;
      left: 24px;

      z-index: 20;

      padding: 10px 18px;

      color: white;
      text-decoration: none;

      font-family: Georgia, serif;

      background: rgba(0,0,0,.45);

      border:
        1px solid rgba(255,255,255,.55);

      border-radius: 30px;

      backdrop-filter: blur(5px);

      transition: .3s;
    }

    .volver:hover {
      background: rgba(0,0,0,.75);
    }


    /* HACEMOS EL PUNTO DE AVANZAR MÁS BONITO */

    .pnlm-hotspot-base {
      cursor: pointer;
    }

    .pnlm-scene {
      filter: drop-shadow(0 0 7px rgba(255,215,120,.9));
    }


    /* TEXTO INFERIOR */

    .indicacion {
      position: absolute;

      bottom: 25px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      color: white;

      font-family: Georgia, serif;

      background: rgba(0,0,0,.45);

      padding: 9px 18px;

      border-radius: 30px;

      backdrop-filter: blur(4px);

      pointer-events: none;

      font-size: 14px;

      letter-spacing: 1px;
    }

  </style>
</head>


<body>

  <a href="index.html" class="volver">
    ← Volver
  </a>


  <div class="titulo">
    <h1>ERYNDOR</h1>
    <p id="nombreEscena">Camino hacia Eryndor</p>
  </div>


  <div id="panorama"></div>


  <div class="indicacion">
    Arrastra para explorar · Pulsa los puntos para avanzar
  </div>


  <script>

    const viewer = pannellum.viewer('panorama', {

      default: {

        firstScene: "camino",

        sceneFadeDuration: 1200,

        autoLoad: true,

        showControls: true

      },


      scenes: {


        /* =========================
           ESCENA 1 — CAMINO
        ========================== */

        camino: {

          title: "Camino hacia Eryndor",

          type: "equirectangular",

          panorama: "eryndor-camino-360.png",

          pitch: -2,

          yaw: 0,

          hfov: 95,

          hotSpots: [

            {
              pitch: -16,

              yaw: 0,

              type: "scene",

              text: "Avanzar hacia Eryndor",

              sceneId: "ciudad",

              targetPitch: -2,

              targetYaw: 0,

              targetHfov: 95
            }

          ]

        },


        /* =========================
           ESCENA 2 — DENTRO DEL MURO
        ========================== */

        ciudad: {

          title: "Eryndor",

          type: "equirectangular",

          panorama: "eryndor-ciudad-360.jpg.png",

          pitch: -3,

          yaw: 0,

          hfov: 95,

          hotSpots: [

            {
              pitch: -15,

              yaw: 180,

              type: "scene",

              text: "Regresar al camino",

              sceneId: "camino",

              targetPitch: -2,

              targetYaw: 0,

              targetHfov: 95
            },

            {
              pitch: -13,

              yaw: 0,

              type: "info",

              text: "Continuar hacia el Palacio de Eryndor"
            }

          ]

        }

      }

    });


    /* CAMBIAR EL SUBTÍTULO SEGÚN LA ESCENA */

    viewer.on('scenechange', function(sceneId) {

      const nombre = document.getElementById('nombreEscena');

      if(sceneId === "camino") {
        nombre.textContent = "Camino hacia Eryndor";
      }

      if(sceneId === "ciudad") {
        nombre.textContent = "Tras las murallas de Eryndor";
      }

    });

  </script>

</body>
</html>
