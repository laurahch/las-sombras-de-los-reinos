
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eryndor · Las sombras de los reinos</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #panorama {
      width: 100%;
      height: 100vh;
    }

    .titulo {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      color: white;
      text-align: center;
      font-family: Georgia, serif;

      text-shadow: 0 2px 10px black;
      pointer-events: none;
    }

    .titulo h1 {
      font-size: 32px;
      letter-spacing: 5px;
      font-weight: normal;
    }

    .titulo p {
      margin-top: 7px;
      font-size: 16px;
      font-style: italic;
    }

    .volver {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 20;

      padding: 10px 16px;

      color: white;
      text-decoration: none;
      font-family: Georgia, serif;

      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
    }
  </style>
</head>

<body>

  <a href="index.html" class="volver">← Volver</a>

  <div class="titulo">
    <h1>ERYNDOR</h1>
    <p>El camino hacia el reino</p>
  </div>

  <div id="panorama"></div>

  <script>
    pannellum.viewer('panorama', {
      type: 'equirectangular',

      panorama: 'eryndor-camino-360.jpg',

      autoLoad: true,

      pitch: 0,
      yaw: 0,
      hfov: 100,

      showControls: true,

      hotSpots: [
        {
          pitch: -18,
          yaw: 0,
          type: 'info',
          text: 'Avanzar hacia Eryndor'
        }
      ]
    });
  </script>

</body>
</html>
